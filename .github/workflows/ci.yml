name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build API
        run: go build -v -o /tmp/task-tracker main.go

      - name: Build healthcheck
        run: go build -v -o /tmp/healthcheck healthcheck.go
