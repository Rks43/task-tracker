services:
  task-tracker:
   build:
    context: . 
   image: task-tracker:1.2
   container_name: task-tracker-api
   expose:
     - "8080"
  nginx:
    image: nginx:alpine
    container_name: task-tracker-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - task-tracker
