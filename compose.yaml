services:
  task-tracker:
   build:
    context: . 
   image: task-tracker:1.2
   container_name: task-tracker-api
   expose:
     - "8080"
  nginx:
    image: nginx:alpine
    container_name: task-tracker-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - task-tracker
  node-exporter:
    image: prom/node-exporter:latest
    container_name: task-tracker-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
  prometheus:
    image: prom/prometheus:latest
    container_name: task-tracker-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:latest
    container_name: task-tracker-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  prometheus-data:
  grafana-data:
