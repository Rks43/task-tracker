services:
  task-tracker:
    build:
      context: .
    image: task-tracker:1.2
    container_name: task-tracker-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: postgres_db
      DB_USER: postgres_user
      DB_PASSWORD: postgres_password
    expose:
      - "8080"
  db:
    image: postgres:latest
    container_name: task-tracker-db
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres_db
      PGDATA: /var/lib/postgresql/pgdata
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./.pgdata:/var/lib/postgresql/pgdata
  nginx:
    image: nginx:alpine
    container_name: task-tracker-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - task-tracker
  node-exporter:
    image: prom/node-exporter:latest
    container_name: task-tracker-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
  prometheus:
    image: prom/prometheus:latest
    container_name: task-tracker-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:latest
    container_name: task-tracker-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  prometheus-data:
  grafana-data:
  pgdata:
